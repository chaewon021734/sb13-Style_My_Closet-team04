spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${OTBOO_DB_HOST:localhost}:${OTBOO_DB_PORT:5432}/${OTBOO_DB_NAME:otboo}
    username: ${OTBOO_DB_USERNAME:otboo}
    password: ${OTBOO_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
