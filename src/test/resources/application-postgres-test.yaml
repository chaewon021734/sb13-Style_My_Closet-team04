spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ootb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  flyway:
    # 이 프로필은 JPA의 PostgreSQL 호환성을 검증하며, migration은 별도 테스트에서 검증합니다.
    enabled: false
