spring:
  datasource:
    url: ${OTBOO_TEST_DB_URL}
    username: ${OTBOO_TEST_DB_USERNAME}
    password: ${OTBOO_TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

jwt:
  refresh-token-cleanup:
    enabled: false
