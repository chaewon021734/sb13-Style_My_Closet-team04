spring:
  datasource:
    url: jdbc:h2:mem:ootbtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # 운영용 PostgreSQL 마이그레이션은 H2 기반 단위·슬라이스 테스트에서 실행하지 않는다.
  flyway:
    enabled: false

  batch:
    job:
      enabled: false

# JwtConfig가 참조하는 테스트 전용 JWT 설정은 spring 하위가 아닌 루트에 둔다.
jwt:
  secret: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  access-token-expiration: 3600000
