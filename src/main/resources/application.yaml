# 공통 설정만 유지
# 기본 프로파일: dev

spring:
  application:
    name: sb13-OOTBS-team04
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

# 진행 중인 요청 작업을 마무리한 뒤 종료하기 위해 graceful shutdown을 사용합니다.
server:
  shutdown: graceful

weather:
  kakao:
    api-key: ${KAKAO_REST_API_KEY:}

otboo:
  storage:
    s3:
      bucket: ${OTBOO_CLOTHES_S3_BUCKET:}
      region: ${OTBOO_AWS_REGION:ap-northeast-2}
      endpoint: ${OTBOO_AWS_ENDPOINT:}
      public-base-url: ${OTBOO_CLOTHES_IMAGE_PUBLIC_BASE_URL:}
      api-call-timeout: ${OTBOO_CLOTHES_S3_API_CALL_TIMEOUT:10s}
      api-call-attempt-timeout: ${OTBOO_CLOTHES_S3_API_CALL_ATTEMPT_TIMEOUT:5s}
