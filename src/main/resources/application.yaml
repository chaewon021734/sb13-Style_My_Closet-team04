spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sb13-OOTBS-team04

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ootb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}

weather:
  kakao:
    api-key: ${KAKAO_REST_API_KEY:}
