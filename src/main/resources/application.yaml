spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: sb13-OOTBS-team04

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ootb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    open-in-view: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ${BATCH_SCHEMA_INITIALIZE:always}

  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT 로그인 및 인증 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

# 날씨 API 설정
weather:
  kakao:
    api-key: ${KAKAO_REST_API_KEY:}
  kma:
    api-key: ${KMA_SERVICE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
