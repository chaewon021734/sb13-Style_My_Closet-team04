spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${OTBOO_DB_HOST:localhost}:${OTBOO_DB_PORT:5432}/${OTBOO_DB_NAME:otboo}
    username: ${OTBOO_DB_USERNAME:otboo}
    password: ${OTBOO_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${OTBOO_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${OTBOO_JPA_FORMAT_SQL:true}
    show-sql: ${OTBOO_JPA_SHOW_SQL:false}
  flyway:
    enabled: ${OTBOO_FLYWAY_ENABLED:true}

server:
  port: ${OTBOO_SERVER_PORT:8080}

logging:
  level:
    root: info
    com.project.sb13ootbsteam04: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.batch: trace
    org.hibernate.orm.jdbc.bind: off
