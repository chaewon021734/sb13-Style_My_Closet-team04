spring:
  datasource:
    url: jdbc:postgresql://${OTBOO_DB_HOST}:${OTBOO_DB_PORT:5432}/${OTBOO_DB_NAME}
    username: ${OTBOO_DB_USERNAME}
    password: ${OTBOO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${OTBOO_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: ${OTBOO_FLYWAY_ENABLED:true}

server:
  port: ${OTBOO_SERVER_PORT:8080}
  # ALB에서 HTTPS를 종료해도 Swagger가 올바른 scheme과 host를 사용하게 합니다.
  forward-headers-strategy: framework

logging:
  level:
    root: info
    com.project.sb13ootbsteam04: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.batch: warn
    org.hibernate.orm.jdbc.bind: warn
