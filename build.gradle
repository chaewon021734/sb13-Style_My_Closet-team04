plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'
description = 'sb13-OOTBS-team04'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter'

    // HTTP API 및 외부 위치 API 호출
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 시작 전 추가 내용
    // 입력값 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 배치와 모니터링
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Security와 JWT 토큰 검증
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // PostgreSQL 데이터베이스
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 구조화된 PostgreSQL 오류 정보로 위반 제약조건을 식별한다.
    implementation 'org.postgresql:postgresql'

    // Redis 캐시
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Kafka 이벤트·메시징 (Confluent Cloud 연결)
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // Elasticsearch 검색
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // AWS S3 이미지 저장
    implementation platform('software.amazon.awssdk:bom:2.57.3')
    implementation 'software.amazon.awssdk:s3'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.property('postgresIntegrationTest',
            providers.environmentVariable('OTBOO_POSTGRES_TEST').orElse('false'))
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                // 전체 라인 커버리지 최소 80%
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
