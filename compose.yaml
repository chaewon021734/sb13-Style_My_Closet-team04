services:
  postgres:
    image: postgres:16
    container_name: ootbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: ootbs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
